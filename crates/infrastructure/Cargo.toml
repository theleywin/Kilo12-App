[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
# «bundled» compila SQLite dentro del binario: la aplicación no depende de
# ninguna biblioteca instalada en el sistema, que es lo que exige RNF-10.
rusqlite = { version = "0.40", features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
